server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trainlog}
    username: ${DB_USERNAME:trainlog}
    password: ${DB_PASSWORD:trainlog}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-min-32-bytes-0123456789}
    expiration-ms: 86400000
